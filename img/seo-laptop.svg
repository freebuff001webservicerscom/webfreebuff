<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 500" width="620" height="500" role="img" aria-label="Bakery website on a laptop with search ranking and traffic analytics cards">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ebf2ee"/><stop offset="1" stop-color="#d6e2db"/>
    </linearGradient>
    <linearGradient id="screenBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFCF7"/><stop offset="1" stop-color="#fff7ec"/>
    </linearGradient>
    <linearGradient id="greenArea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1FA968" stop-opacity=".3"/>
      <stop offset="1" stop-color="#1FA968" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="blob" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFE8CB"/><stop offset="1" stop-color="#FFE8CB" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#081a13" flood-opacity=".16"/>
    </filter>
    <filter id="shadowSm" x="-40%" y="-40%" width="180%" height="190%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#081a13" flood-opacity=".13"/>
    </filter>
    <clipPath id="screen"><rect x="104" y="43" width="412" height="274" rx="8"/></clipPath>
  </defs>

  <circle cx="500" cy="150" r="200" fill="url(#blob)"/>

  <!-- laptop -->
  <g filter="url(#shadow)">
    <rect x="95" y="34" width="430" height="292" rx="16" fill="#0b1f18"/>
    <rect x="104" y="43" width="412" height="274" rx="8" fill="url(#screenBg)"/>
  </g>

  <g clip-path="url(#screen)">
    <!-- site header -->
    <text x="126" y="70" font-family="'Plus Jakarta Sans',Helvetica,Arial,sans-serif" font-size="9" font-weight="800" letter-spacing="1.2" fill="#241B12">FLOUR &amp; CO.</text>
    <rect x="336" y="63" width="28" height="4" rx="2" fill="#D9CFC2"/>
    <rect x="374" y="63" width="24" height="4" rx="2" fill="#D9CFC2"/>
    <rect x="408" y="63" width="30" height="4" rx="2" fill="#D9CFC2"/>
    <circle cx="486" cy="66" r="8" fill="none" stroke="#241B12" stroke-width="1.4"/>
    <path d="M483 66h6" stroke="#241B12" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="104" y1="88" x2="516" y2="88" stroke="#F2E7D8" stroke-width="1"/>

    <!-- hero copy -->
    <text x="126" y="114" font-family="'Plus Jakarta Sans',Helvetica,Arial,sans-serif" font-size="6.5" font-weight="700" letter-spacing="1.4" fill="#B08954">FRESHLY BAKED DAILY</text>
    <text x="125" y="150" font-family="Georgia,'Times New Roman',serif" font-size="30" font-weight="700" fill="#241B12">Any flavor</text>
    <text x="125" y="180" font-family="Georgia,'Times New Roman',serif" font-size="30" font-weight="700" fill="#241B12">you desire</text>
    <rect x="126" y="198" width="184" height="5" rx="2.5" fill="#DED2C3"/>
    <rect x="126" y="210" width="142" height="5" rx="2.5" fill="#E6DCCE"/>
    <rect x="126" y="224" width="94" height="28" rx="14" fill="#241B12"/>
    <text x="173" y="242" font-family="'Plus Jakarta Sans',Helvetica,Arial,sans-serif" font-size="8.5" font-weight="700" fill="#fff" text-anchor="middle">Order now</text>

    <!-- donuts -->
    <circle cx="392" cy="148" r="46" fill="#F8CBA9"/>
    <circle cx="392" cy="148" r="40" fill="#F189B1"/>
    <circle cx="392" cy="148" r="14" fill="#FFFBF5"/>
    <g stroke="#fff7ec" stroke-width="2.6" stroke-linecap="round">
      <line x1="376" y1="124" x2="382" y2="130"/>
      <line x1="404" y1="118" x2="410" y2="126"/>
      <line x1="416" y1="152" x2="414" y2="161"/>
      <line x1="372" y1="158" x2="380" y2="164"/>
      <line x1="386" y1="176" x2="394" y2="178"/>
      <line x1="402" y1="140" x2="408" y2="146"/>
    </g>

    <circle cx="462" cy="198" r="33" fill="#F8CBA9"/>
    <circle cx="462" cy="198" r="27" fill="#8C5B39"/>
    <circle cx="462" cy="198" r="10" fill="#FFFBF5"/>
    <g stroke="#E9C9A9" stroke-width="2.2" stroke-linecap="round">
      <line x1="450" y1="186" x2="455" y2="191"/>
      <line x1="470" y1="184" x2="476" y2="190"/>
      <line x1="466" y1="206" x2="472" y2="212"/>
    </g>

    <circle cx="360" cy="210" r="27" fill="#F8CBA9"/>
    <circle cx="360" cy="210" r="21" fill="#B5CE8D"/>
    <circle cx="360" cy="210" r="8" fill="#FFFBF5"/>
    <g stroke="#fff7ec" stroke-width="2" stroke-linecap="round">
      <line x1="351" y1="200" x2="356" y2="204"/>
      <line x1="366" y1="204" x2="371" y2="209"/>
      <line x1="355" y1="218" x2="360" y2="222"/>
    </g>

    <!-- product strip -->
    <g>
      <rect x="126" y="264" width="110" height="44" rx="8" fill="#FBF1E3"/>
      <circle cx="148" cy="286" r="13" fill="#F189B1"/>
      <circle cx="148" cy="286" r="4.5" fill="#FBF1E3"/>
      <rect x="168" y="278" width="50" height="5" rx="2.5" fill="#D9CCBB"/>
      <rect x="168" y="289" width="34" height="5" rx="2.5" fill="#E6DCCE"/>

      <rect x="246" y="264" width="110" height="44" rx="8" fill="#FBF1E3"/>
      <circle cx="268" cy="286" r="13" fill="#8C5B39"/>
      <circle cx="268" cy="286" r="4.5" fill="#FBF1E3"/>
      <rect x="288" y="278" width="50" height="5" rx="2.5" fill="#D9CCBB"/>
      <rect x="288" y="289" width="34" height="5" rx="2.5" fill="#E6DCCE"/>

      <rect x="366" y="264" width="110" height="44" rx="8" fill="#FBF1E3"/>
      <circle cx="388" cy="286" r="13" fill="#B5CE8D"/>
      <circle cx="388" cy="286" r="4.5" fill="#FBF1E3"/>
      <rect x="408" y="278" width="50" height="5" rx="2.5" fill="#D9CCBB"/>
      <rect x="408" y="289" width="34" height="5" rx="2.5" fill="#E6DCCE"/>
    </g>
  </g>

  <!-- base -->
  <path d="M55 326h510l21 36c3 6-1 12-8 12H42c-7 0-11-6-8-12z" fill="url(#base)"/>
  <path d="M285 326h50l6 10h-62z" fill="#ccd9d2"/>

  <!-- search ranking card -->
  <g filter="url(#shadowSm)">
    <rect x="34" y="310" width="182" height="154" rx="16" fill="#fff"/>
    <text x="54" y="338" font-family="'Plus Jakarta Sans',Helvetica,Arial,sans-serif" font-size="9" font-weight="600" fill="#7f8b84">Search ranking</text>
    <text x="196" y="338" font-family="'Plus Jakarta Sans',Helvetica,Arial,sans-serif" font-size="9" font-weight="800" fill="#1FA968" text-anchor="end">+128%</text>
    <text x="54" y="376" font-family="'Plus Jakarta Sans',Helvetica,Arial,sans-serif" font-size="32" font-weight="800" fill="#0b1f18" letter-spacing="-1">#1</text>
    <text x="90" y="376" font-family="'Plus Jakarta Sans',Helvetica,Arial,sans-serif" font-size="8" font-weight="500" fill="#93a198">on Google</text>
    <text x="54" y="392" font-family="'Plus Jakarta Sans',Helvetica,Arial,sans-serif" font-size="8" font-weight="600" fill="#7f8b84">“artisan donuts”</text>
    <path d="M54 432 L82 416 L108 422 L134 400 L160 406 L196 384 L196 448 L54 448 Z" fill="url(#greenArea)"/>
    <path d="M54 432 L82 416 L108 422 L134 400 L160 406 L196 384" fill="none" stroke="#1FA968" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="196" cy="384" r="4" fill="#1FA968" stroke="#fff" stroke-width="2"/>
  </g>

  <!-- organic traffic card -->
  <g filter="url(#shadowSm)">
    <rect x="436" y="12" width="170" height="58" rx="12" fill="#fff"/>
    <text x="454" y="34" font-family="'Plus Jakarta Sans',Helvetica,Arial,sans-serif" font-size="8.5" font-weight="600" fill="#7f8b84">Organic traffic</text>
    <text x="454" y="56" font-family="'Plus Jakarta Sans',Helvetica,Arial,sans-serif" font-size="17" font-weight="800" fill="#0b1f18" letter-spacing="-.4">+128%</text>
    <path d="M540 48l8-9 6 6 10-12" fill="none" stroke="#1FA968" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- keyword card -->
  <g filter="url(#shadowSm)">
    <rect x="398" y="332" width="188" height="76" rx="14" fill="#fff"/>
    <text x="416" y="356" font-family="'Plus Jakarta Sans',Helvetica,Arial,sans-serif" font-size="8.5" font-weight="600" fill="#7f8b84">Top keyword</text>
    <text x="416" y="378" font-family="'Plus Jakarta Sans',Helvetica,Arial,sans-serif" font-size="12" font-weight="800" fill="#0b1f18" letter-spacing="-.2">artisan donuts</text>
    <text x="416" y="393" font-family="'Plus Jakarta Sans',Helvetica,Arial,sans-serif" font-size="8" font-weight="500" fill="#93a198">Position 1 · 2.4k searches</text>
    <circle cx="554" cy="368" r="15" fill="#E8F8EF"/>
    <text x="554" y="373" font-family="'Plus Jakarta Sans',Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#1A8F5A" text-anchor="middle">#1</text>
  </g>

  <g fill="#1FA968" opacity=".35">
    <circle cx="72" cy="88" r="3.5"/><circle cx="46" cy="180" r="2.5"/><circle cx="580" cy="250" r="3"/>
  </g>
</svg>
